name: Planner Reminder Scan

on:
  schedule:
    - cron: '0 * * * *'   # hourly, UTC
  workflow_dispatch: {}    # allows manually triggering a run for testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call internal reminder-scan endpoint
        run: |
          curl -sf -X POST "${{ secrets.RENDER_APP_URL }}/api/v1/internal/scan-planner-reminders" \
            -H "X-Internal-Secret: ${{ secrets.INTERNAL_TRIGGER_SECRET }}"
